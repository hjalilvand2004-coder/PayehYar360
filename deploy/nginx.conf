server {
    listen 80;
    server_name _;

    # محدودسازی حجم و نرخ در سطح Gateway (بند ۱۴.۳)
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API و health به core-api
    location /api/ {
        proxy_pass http://core-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://core-api:8000;
        proxy_set_header Host $host;
    }

    location /metrics {
        # متریک‌ها فقط برای شبکه داخلی/پایش — در صورت نیاز محدود شود
        proxy_pass http://core-api:8000;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location /docs { proxy_pass http://core-api:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://core-api:8000; proxy_set_header Host $host; }
}
